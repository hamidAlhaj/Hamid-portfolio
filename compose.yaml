services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - portfolio-data:/var/lib/postgresql/data
volumes:
  portfolio-data:
